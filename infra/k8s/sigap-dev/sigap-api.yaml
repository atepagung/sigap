# sigap-api: .NET 10, port 8080, GET /health/live dan /health/ready (UR). Request 300m/512Mi, limit 1000m/1Gi,
# 2 replika, tanpa persistent volume (lampiran lewat object storage: Lampiran__Driver=s3).
# Nilai per lingkungan dan rahasia dari Secret "sigap-api-env" (vault; apps/sigap-api/.env.example). ConfigMap
# di bawah hanya berisi keputusan penempatan sigap-dev yang tidak rahasia.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sigap-api-penempatan
data:
  ASPNETCORE_ENVIRONMENT: Production
  # Dua replika tanpa volume: lampiran wajib di object storage.
  Lampiran__Driver: s3
  # Batas BMKG 60 permintaan/menit per IP dibagi dua replika yang keluar lewat satu IP.
  Bmkg__BatasPermintaanPerMenit: "25"
  # Pemicu otomatis tetap mati di sigap-dev (keputusan penempatan, ACCESS_RULES A11).
  Bmkg__Aktif: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigap-api
  labels:
    app.kubernetes.io/name: sigap-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sigap-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sigap-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sigap-api
          image: sigap-api
          ports:
            - name: http
              containerPort: 8080
          # Urutan: ConfigMap lalu Secret; kunci yang sama di Secret menang.
          envFrom:
            - configMapRef:
                name: sigap-api-penempatan
            - secretRef:
                name: sigap-api-env
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Siap = database terjangkau (API_CONTRACT #47).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sigap-api
  labels:
    app.kubernetes.io/name: sigap-api
spec:
  selector:
    app.kubernetes.io/name: sigap-api
  ports:
    - name: http
      port: 8080
      targetPort: http
