# Deployment sigap-web dan sigap-api ke namespace sigap-dev.
#
#   kubectl kustomize infra/k8s/sigap-dev          # tampilkan hasil
#   kubectl apply -k infra/k8s/sigap-dev           # terapkan (butuh akses cluster)
#
# [ASUMSI] Format manifest, registry image, dan cara platform men-deploy belum diketahui (starter.mfe belum
# tersedia; DUMMY_REGISTRY bagian 9 butir 26). Resource dan health check mengikuti UR (tabel container).
# Nilai per lingkungan TIDAK ada di sini: Secret "sigap-api-env" (dari vault) dan ConfigMap "sigap-web-env"
# dibuat di luar repo, isinya mengikuti apps/*/.env.example.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sigap-dev
resources:
  - namespace.yaml
  - sigap-web.yaml
  - sigap-api.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: sigap
    includeSelectors: false
images:
  # Registry dan tag diganti di satu tempat ini. sigap-api memakai target Docker "dev" (iam-dummy, hanya
  # sigap-dev); target "production" gagal dibangun selama dummy ter-resolve (SIGAP001).
  - name: sigap-web
    newName: REGISTRY_BELUM_DITETAPKAN/sigap-web
    newTag: dev
  - name: sigap-api
    newName: REGISTRY_BELUM_DITETAPKAN/sigap-api
    newTag: dev
