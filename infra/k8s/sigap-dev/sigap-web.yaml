# sigap-web: Angular hasil build, berkas statis, port 8080, GET /healthz (UR). Request 50m/128Mi,
# limit 200m/256Mi, 2 replika, tanpa persistent volume. Konfigurasi dari ConfigMap "sigap-web-env"
# (apps/sigap-web/.env.example) — nilainya publik, terbaca peramban.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigap-web
  labels:
    app.kubernetes.io/name: sigap-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sigap-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sigap-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sigap-web
          image: sigap-web
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sigap-web-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sigap-web
  labels:
    app.kubernetes.io/name: sigap-web
spec:
  selector:
    app.kubernetes.io/name: sigap-web
  ports:
    - name: http
      port: 8080
      targetPort: http
