# Penyaji berkas statis remote sigap-web (UR: port 8080, health check GET /healthz).
# [ASUMSI] cara platform menyajikan remote belum diketahui; diganti bila starter.mfe membawa konfigurasi resmi.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Shell memuat remote dari origin lain, jadi manifest, chunk, dan config.json wajib boleh dibaca lintas origin.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Ditulis dari environment saat container mulai (40-sigap-config.sh), bukan bagian bundel.
    location = /config.json {
        alias /tmp/sigap/config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Manifest federasi tidak boleh di-cache: isinya menunjuk chunk ber-hash yang berganti tiap build.
    location = /remoteEntry.json {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Berkas ber-ekstensi (chunk, stylesheet, manifest) tanpa fallback: chunk yang hilang harus 404, bukan
    # index.html ber-status 200 yang membuat federasi gagal dengan galat membingungkan.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # Mode mandiri (sigap-dev belum punya shell): rute flat /sigap-bencana/… dimuat ulang tetap ke index.html.
    location / {
        try_files $uri /index.html;
    }
}
