# SEMENTARA (P4.8): penyaji berkas statis remote untuk verifikasi container.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Shell memuat remote dari origin lain, jadi remoteEntry.json dan chunk wajib boleh dibaca lintas origin.
    add_header Access-Control-Allow-Origin "*" always;

    # Manifest federasi tidak boleh di-cache: isinya menunjuk chunk ber-hash yang berganti tiap build.
    location = /remoteEntry.json {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
